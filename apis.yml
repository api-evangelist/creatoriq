x-unwired-artifacts:
- file: mcp/creatoriq-mcp.yml
  reason: >-
    A DERIVED candidate tool surface. CreatorIQ publishes no MCP server, so no MCPServer pointer is
    emitted — the pointer would assert a server that does not exist.
- file: packages/creatoriq-packages.yml
  reason: >-
    Records an honest zero. CreatorIQ ships no first-party SDK in any registry, so neither a Packages
    nor an SDKs pointer is emitted.
- file: well-known/creatoriq-well-known.yml
  reason: >-
    Records an absence — every /.well-known path returns 404 or 403 on every CreatorIQ host. No
    WellKnown and no SecurityTxt pointer is emitted; a file documenting an absence must not be scored
    as a presence.
- file: a2a/
  reason: >-
    Not created. /.well-known/agent-card.json and /.well-known/agent.json were probed on all four
    CreatorIQ hosts and returned 404 or 403. An agent card is search-only and is never authored on a
    provider's behalf.
