aid: creatoriq
name: CreatorIQ
description: >-
  CreatorIQ is an enterprise creator- and influencer-marketing platform used by brands and agencies to
  discover creators, build and manage a private creator network, run and measure campaigns, handle
  creator payouts, and report on performance across Instagram, TikTok, YouTube and other social
  networks. Its public REST API — documented on a Stoplight portal at apidocs.creatoriq.com and served
  from https://apis.creatoriq.com — exposes the customer's own CRM: publishers (creators), campaigns,
  lists, one-sheets, notes, divisions, social accounts and post/account metrics, an asynchronous
  reporting surface of forty report views, ecommerce promo codes and transactions, affiliate link
  tracking, conversion metrics, SafeIQ brand-safety scoring, and a Payments API for payouts and
  payables. A pub/sub webhook API lets integrators subscribe to campaign, creator, one-sheet and
  list events with MD5 and SHA-256 signed callbacks. Authentication is a single `x-api-key` header
  issued per partner or per division by a CreatorIQ account manager; there is no self-serve signup.
url: https://raw.githubusercontent.com/api-evangelist/creatoriq/refs/heads/main/apis.yml
image: https://www.creatoriq.com/hubfs/2025%20Rebrading%20Assets%20%3E%20DO%20NOT%20DELETE/Logos/creatorIQ-logo-new.svg
x-type: company
x-source: harvest:secondary-market
