rfc9457_note: >-
  No operation in any CreatorIQ spec declares application/problem+json. There is no `type` URI, no
  problem-type registry, and no stable machine-readable error code — the docs describe "a JSON error
  message and error code" but never enumerate the codes. An agent can branch on HTTP status and on
  free-text `message`, nothing more.
