                  EstimatedImpressions:
                    type: integer
                    description: |
                      Estimated value of impressions is calculated using regression models trained on historical post and account data (such as followers, likes, comments, and post age).
                      This value is populated if the Impressions metric is unavailable because the social account is not authenticated, and no value is entered manually.
                      For Instagram, separate models are used for stories and post types (e.g., image, carousel, reel). For TikTok, Facebook, Twitter, and Pinterest, impressions are estimated from actual or predicted views. For YouTube, Twitch, and Snapchat, estimated impressions are not provided.
                      For example, if a post has 100,000 followers and 2,000 likes, and no actual impression value is available, a regression model may estimate the impressions as approximately 18,500, depending on the platform, post type, and engagement level.
