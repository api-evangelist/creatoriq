        '404':
          $ref: '#/components/responses/ErrorResponse404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
    patch:
      tags:
        - Campaign
      summary: Update Campaign
      description: 'Updates a certain set of fields of a campaign.<br><br>To fill the field CampaignManagerId properly use this API (https://public-apidoc.creatoriq.com/#4d43df49-10dc-49ec-855b-d447369fd7ca) to get users and their IDs.'
      operationId: patchCampaigns
      parameters:
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            examples:
              - 843362
          examples:
            default:
              value: 843362
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/campaignBody'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '500':
          $ref: '#/components/responses/ErrorResponse400'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
    delete:
      tags:
        - Campaign
      summary: Delete Campaign
      description: Delete a specific campaign
      operationId: deleteCampaign
      parameters:
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            format: int32
            examples:
              - 2355
          examples:
            default:
              value: 2355
      responses:
        '204':
          description: Campaign was deleted
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
  '/crm/v1/api/campaign/{campaignId}/publishers':
    get:
      tags:
        - Campaign
      summary: Get Campaign Publishers
      description: |
        Returns the list of publishers associated with a campaign, post requirements and campaign specific information.
         ***
        Example of url with query parameters:
        > https://apis.creatoriq.com/crm/v1/api/campaign/{{campaignId}}/publishers?candidates={{candidates}}&sections={{sections}}&publisherId={{publisherId}}
      operationId: getCampaignPublishers
      parameters:
        - name: candidates
          in: query
          description: 0 - Show "ActiveInCampaign" only (default value)<br>1 - Show "CandidateToCampaign" only<br>2 - Show both "ActiveInCampaign" and "CandidateToCampaign"
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
              - 2
            format: int32
            examples:
              - 0
          examples:
            default:
              value: 0
        - name: sections
          in: query
          description: |
            Comma-separated list of sections you need. Show additional info about publisher if publisherId in query params
            Possible values are:
              - ScheduledPosts
              - Contract
              - InstructionsForPublishers
              - CampaignDashboardLink
              - FinalPayout
              - PublisherCampaignsListLink
              - PublishersCustomFields
              - FraudSummary
              - CampaignFlags
              - SocialAccounts
          required: false
          schema:
            type: string
            examples:
              - 'ScheduledPosts,InstructionsForPublishers,PublishersCustomFields,SocialAccounts'
          examples:
            default:
              value: 'ScheduledPosts,InstructionsForPublishers,PublishersCustomFields,SocialAccounts'
        - name: publisherId
          in: query
          description: Id of publisher
          required: false
          schema:
            type: integer
            format: int32
            examples:
              - 23354
          examples:
            default:
              value: 23354
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            format: int32
            examples:
              - 44560
          examples:
            default:
              value: 44560
      responses:
        '200':
          $ref: '#/components/responses/CampaignPublishersResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
    post:
      tags:
        - Campaign
      summary: Assign Publisher to Campaign
      description: Assign a publisher (creator) to a specific campaign.<br>This API endpoint requires campaignId in the parameters. The body should contain publisherId and status
      operationId: assignPublisherToCampaign
      parameters:
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            format: int32
            examples:
              - 42066
          examples:
            default:
              value: 42066
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPublisherToCampaignBody'
      responses:
        '201':
          $ref: '#/components/responses/AssignPublisherToCampaignSuccessResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
    delete:
      tags:
        - Campaign
      summary: Delete Publishers from Campaign
      description: Removes a publishers (creator) from a specific campaign.
      operationId: deletePublisherFromCampaign
      parameters:
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            examples:
              - 42066
          examples:
            default:
              value: 42066
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePublisherFromCampaignBody'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
    patch:
      tags:
        - Campaign
      summary: Update Campaign Publisher details
      description: Update Campaign Publisher details
      operationId: updateCampaignPublisherDetails
      parameters:
        - name: publisherId
          in: query
          description: Unique publisher id
          required: true
          schema:
            type: integer
            format: int32
            examples:
              - 42066001
          examples:
            default:
              value: 42066001
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            format: int32
            examples:
              - 42066
          examples:
            default:
              value: 42066
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignPublisherDetailsBody'
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
  '/crm/v1/api/campaign/{campaignId}/scheduledPosts':
    get:
      tags:
        - Campaign
      summary: Get Campaign Scheduled Posts
      description: Returns the set of scheduled posts from a single campaign.
      operationId: getCampaignScheduledPosts
      parameters:
        - name: publisherId
          in: query
          description: CIQ identifier/Id to uniquely identify the publisher. Do not pass publisherId or networkPublisherId here. Instead pass the Id attribute for the publisher/creator.
          required: false
          schema:
            type: integer
            format: int32
            examples:
              - 42066001
          examples:
            default:
              value: 42066001
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            examples:
              - 848781
          examples:
            default:
              value: 848781
      responses:
        '200':
          $ref: '#/components/responses/CampaignScheduledPostsSuccessResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '404':
          $ref: '#/components/responses/ErrorResponse404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
  '/crm/v1/api/campaign/{campaignId}/publishersList':
    get:
      tags:
        - Campaign
      summary: Get Campaign Publishers List
      description: returns the list of publishers (creators) with the standard publisher object within a single campaign.
      operationId: getCampaignPublishersList
      parameters:
        - name: fields
          in: query
          description: |
            Fields to include in the response. Possible values are listed below.
            Example: `fields=PublisherId,PublisherName`.
            Fields: MPID will always be returned.
          schema:
            $ref: '#/components/schemas/campaignPublishersListFieldsQuery'
            example: PublisherName
          examples:
            default:
              value: PublisherName
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            examples:
              - 42066
          examples:
            default:
              value: 42066
      responses:
        '200':
          $ref: '#/components/responses/CampaignPublishersListSuccessResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse400'
        '403':
          description: Forbidden
        '404':
