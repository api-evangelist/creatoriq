    CampaignPublishersSinglePublisherSuccessResponseModel:
      type: object
      description: Used when `publisherId` param is in query
      properties:
        type:
          const: CampaignPublisher
          description: Type of Search
          examples:
            - CampaignPublisher
        href:
          type: string
          description: CreatorIQ API URL to get campaign information
          examples:
            - 'https://apis.creatoriq.com/crm/v1/campaign/42066/publishers'
        CampaignPublisher:
          type: object
          description: Single publisher in Campaign when `publisherId` param is in query
          allOf:
            - $ref: '#/components/schemas/CampaignPublisherModel'
            - type: object
              properties:
                Payable:
                  type: boolean
                PayableDate:
                  type:
                    - string
                    - 'null'
                  format: date-time
                  examples:
                    - '2023-08-03 15:07:36'
                NotPayableReason:
                  type:
                    - string
                    - 'null'
                  examples:
                    - PayPal email not set
                HasPayments:
                  type: string
                  examples:
                    - '0'
                HasFixedPayments:
                  type: boolean
                IsFixedPaymentRejected:
                  type: boolean
                PaymentRejectionNote:
                  type:
                    - string
                    - 'null'
                  examples:
                    - Some rejection note
                IntegrationSettings:
                  $ref: '#/components/schemas/IntegrationSettingsModel'
                NetworkCampaignName:
                  type:
                    - string
                    - 'null'
                  description: External campaign name
                  examples:
                    - NetworkCampaignCola
                TrackingLinkCreationType:
                  type: string
                  enum:
                    - mass-generate
                    - link-by-link
                    - null
                  description: Exists only if if campaign has TrackingLinkCreationType value
                CampaignFlags:
                  $ref: '#/components/schemas/CampaignFlagsModel'
                  description: Exists only when `sections` param contains `CampaignFlags`
                SocialAccounts:
                  type: array
                  description: Exists only when `sections` param contains `SocialAccounts`
                  items:
                    type: object
                    properties:
                      Id:
                        type: integer
                        description: Social Account ID in CRM
                        examples:
                          - 5724572
                      Network:
                        type: string
                        enum:
                          - youtube
                          - twitter
                          - facebook
                          - instagram
                          - google
                          - vine
                          - weibo
                          - line
                          - tiktok
                          - twitch
                          - tumblr
                          - pinterest
                          - snapchat
                          - linkedin
                          - reddit
                          - web
                          - blog
                        description: Network name
                        examples:
                          - instagram
                      SocialNetworkId:
                        type: string
                        description: Social Network account ID
                        examples:
                          - '7729304922060436499'
                      NetworkUser:
                        type: string
                        description: Social Network username
                        examples:
                          - UCvdJ4OZRbLkH3RTRvySQjxRc
                      FullName:
                        type: string
                        description: Social Network full name
                        examples:
                          - Andrew Torwalds
                      YoutubeTitle:
                        type: string
                        description: Youtube account title
                        examples:
                          - My YT channel
                      IsCreatorMarketplaceEnabled:
                        type: integer
                        enum:
                          - 0
                          - 1
                        description: Flag of Creator Marketplace enabled
                        examples:
                          - 1
                    required:
                      - Id
                      - Network
                      - SocialNetworkId
                      - NetworkUser
                      - FullName
                      - YoutubeTitle
                      - IsCreatorMarketplaceEnabled
              required:
                - Payable
                - PayableDate
                - NotPayableReason
                - HasPayments
                - HasFixedPayments
                - IsFixedPaymentRejected
                - PaymentRejectionNote
                - IntegrationSettings
                - NetworkCampaignName
      required:
        - type
        - href
        - CampaignPublisher
