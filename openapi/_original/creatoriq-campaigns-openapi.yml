              examples:
                - []
            - type: object
              description: When TaskStatus is DONE or ERRORED
              properties:
                Status:
                  type: integer
                  enum:
                    - 200
                    - 201
                    - 204
                    - 400
                    - 404
                  examples:
                    - 204
                Body:
                  type: string
                  description: |
                    Body of the Async task's response.
                    Empty or JSON of error in case of Status = 400
                  examples:
                    - '{"type":"CoreException","CoreException":{"code":400,"message":"Publisher not found"}}'
                Headers:
                  type: object
                  properties:
                    Cache-Control:
                      type: string
                      examples:
                        - '"no-cache" or "max-age=3600"'
                    Date:
                      type: string
                      description: Human-readable date
                      examples:
                        - 'Mon, 20 Jan 2022 08:52:29 GMT'
                    content-type:
                      type: string
                      examples:
                        - application/json; charset=UTF-8
                  required:
                    - Cache-Control
                    - Date
              required:
                - Status
                - Body
                - Headers
      required:
        - TaskId
