  '/crm/v1/api/campaign/{campaignId}/updateActivity':
    patch:
      tags:
        - Campaign
      summary: Update Activity Async
      description: In order to update campaign activity asynchronously you need to make a sequence of the same queries and review status of the task.<br>First request must return an object with "TaskId"<br>In the next iteration if the item is still processing the endpoint must return the same object but in "PROCESSING" status.<br>When the item processed it must return the same object but in "DONE" status.
      operationId: updateActivityAsync
      parameters:
        - name: publisherId
          in: query
          description: Unique publisher id
          required: false
          schema:
            type: integer
            examples:
              - 42066002
          examples:
            default:
              value: 42066002
        - name: campaignId
          in: path
          description: Unique campaign id
          required: true
          schema:
            type: integer
            examples:
              - 42066
          examples:
            default:
              value: 42066
      responses:
        '200':
          $ref: '#/components/responses/UpdateActivityAsyncSuccessResponse'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
  '/crm/v1/api/campaign/{campaignId}/dailyStats':
    get:
