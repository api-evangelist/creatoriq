    CampaignActivitySuccessResponseModel:
      type: object
      properties:
        type:
          const: CampaignActivity
          description: Type of Search
          examples:
            - CampaignActivity
        href:
          type: string
          description: Link to fetch current campaign activity
          examples:
            - 'https://apis.creatoriq.com/crm/v1/api/campaign/856302/activity'
        CampaignActivity:
          type: object
          description: Campaign activity data
          properties:
            items:
              type: array
              description: An array of all the posts for the campaign
              items:
                type: object
                description: Post info with statistics
                properties:
                  Id:
                    type: integer
                    format: int32
                    examples:
                      - 3136783
                  CampaignId:
                    type: integer
                    format: int32
                    examples:
                      - 44560
                  SocialNetwork:
                    type: string
                    examples:
                      - Instagram
                  SocialNetworkId:
                    type: string
                    examples:
                      - '17773493878'
                  PublisherId:
                    type: integer
                    format: int32
                    examples:
                      - 1453672
                  UserName:
                    type: string
                    examples:
                      - sportlivelemur
                  Type:
                    type:
                      - string
                      - 'null'
                    description: |
                      Indicates how the post was added to the campaign. `manual` — post was added manually via API or UI (link, file upload, or stream). `null` or other values — post was automatically discovered and matched to the campaign. For content format (story, video, image, etc.), use `PostType` instead.
                    default: null
                    examples:
                      - manual
                  PostId:
                    type: string
                    examples:
                      - '2203166338554101407_17773493878'
                  Score:
                    type: string
                    examples:
                      - ''
                    x-deprecated: true
                  EarnedMedia:
                    type: integer
                    description: The post's earned media calculated by formula
                    format: int32
                    examples:
                      - 1001
                  ActualReach:
                    type:
                      - string
                      - 'null'
                    description: 'Reach that is manually inputted from a CreatorIQ user, often after a creator has shared a screenshot of the metrics of this post. Social platforms - Instagram, TikTok, Facebook, Twitter, Blog. Type - Post Level'
                    default: null
                  NetworkReach:
                    type:
                      - string
                      - 'null'
                    description: 'Reach for authenticated accounts. This value comes directly from the social platform. Social platforms - Instagram, TikTok, Facebook, Twitter, Blog. Type - Post Level/Authenticated Accounts'
                    default: null
                  EstimatedReach:
                    type: integer
                    description: |
                      Estimated value of reach is calculated using regression models trained on historical data. 
                      For Instagram, different models are used for each post type (e.g., image, carousel, reel, story), based on metrics like impressions, engagement, and followers. For other platforms (e.g., TikTok, Facebook, Twitter, Pinterest), reach is estimated from impressions using a power-law scaling function.
                      This value is populated if the Reach metric is unavailable because the social account is not authenticated, and no value is entered manually. For YouTube, Twitch, and Snapchat, estimated reach is not provided.
                      For example, if actual or estimated impressions are 20,000, the resulting EstimatedReach would be approximately 15,400.
                    format: int32
                    examples:
                      - 1
                  EMV:
                    type: integer
                    description: |
                      Estimated Media Value (EMV) is a calculated representation of the earned media value of a post, based on engagement metrics. The specific metrics and weights used vary by social platform (e.g., likes, comments, shares, views, retweets, etc).
                      EMV quantifies the approximate monetary value generated by organic post engagement using platform-specific logic and scaling curves.
                      This value is populated when engagement data is available and is intended to help benchmark the performance of influencer content or campaigns in monetary terms. 
                      The calculation involves computing a weighted linear value from platform-defined engagement types, followed by a nonlinear (logarithmic) scaling function to account for saturation effects.
                    format: int32
                    examples:
                      - 1
                  Reach:
                    type: integer
                    description: |
                      Number of unique impressions.
                      This can come from either `NetworkReach` for authenticated accounts 
                      OR reach value manually entered by the creator (`ActualReach`) 
                      OR estimated reach value (`EstimatedReach`) which is calculated in the absence of `NetworkReach` and `ActualReach`. Social platforms - Instagram, TikTok, Facebook, Twitter, Blog. Type - Post Level/Authenticated Accounts
                    format: int32
                    examples:
                      - 1
                  ExtendedReach:
                    type:
                      - string
                      - 'null'
                    description: for Twitter means sum of all the followers of accounts that have retweeted the post. Social platforms - Twitter. Type - Post Level
                    default: null
                    x-deprecated: true
                  Likes:
                    type: integer
                    description: 'Number of likes. Social platforms - Instagram,TikTok,Youtube,Facebook,Twitter,Linkedin,Snapchat. Type - Post Level'
                    format: int32
                    examples:
                      - 20
                  Comments:
                    type: integer
                    description: 'Number of comments. Social platforms - Instagram,TikTok,Youtube,Facebook,Twitter,Linkedin,Blog,Twitch. Type - Post Level'
                    format: int32
                    examples:
                      - 10
                  Retweets:
                    type:
                      - string
                      - 'null'
                    description: Post Retweets (Shares). Social platforms - Twitter. Type - Post Level.
                    default: null
                  Views:
                    type:
                      - string
                      - 'null'
                    description: Number of post views. Social platforms - All. Type - Post Level.
                    default: null
                    x-deprecated: true
                  EngagedViews_next:
                    type:
                      - string
                      - 'null'
                    description: |
                      Number of post views. Social platforms - All. Type - Post Level.
                      > **Warning**: The **Views** field will be deprecated soon. Use this field instead of it.
                    default: null
                  MinutesWatched:
                    type:
                      - string
                      - 'null'
                    description: Aggregate number of minutes users have spent watching a specific video.  Social platforms - Youtube. Type - Post Level.
                    default: null
                    examples:
