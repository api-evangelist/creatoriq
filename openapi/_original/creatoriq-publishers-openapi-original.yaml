openapi: 3.1.0
info:
  version: 1.0.0
  title: CreatorIQ CRM Publishers API
  description: CreatorIQ CRM APIs for Publishers (Influencer/Creator) resource
  termsOfService: 'https://www.creatoriq.com/legal/terms-of-use'
  contact:
    name: CreatorIQ
    url: 'https://www.creatoriq.com'
    email: support@creatoriq.com
  license:
    url: 'https://www.apache.org/licenses/LICENSE-2.0.html'
    name: Apache 2.0
servers:
  - url: 'https://apis.creatoriq.com'
    description: Live
paths:
  '/crm/v1/api/publisher/{publisherId}':
    get:
      tags:
        - Publisher
      summary: Find Publisher by ID
      description: Return particular Publisher Information
      operationId: getPublisherPublisherId
      parameters:
        - name: key
          in: query
          description: |
            Specifies which identifier is used in the request.
            Set to `id` if you are using the internal `id` field as identifier.
            If you are using `PublisherId` as identifier(default behavior), this parameter should be omitted.
          required: false
          schema:
            type: string
            enum:
              - Id
              - PublisherId
            pattern: '^[a-zA-Z0-9]+$'
            examples:
              - Id
          examples:
            default:
              value: Id
        - name: publisherId
          in: path
          description: Unique Publisher identifier
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]+$'
            examples:
              - '999999'
          examples:
            default:
              value: '999999'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    description: Type of Search
                    examples:
                      - Publisher
                  Publisher:
                    $ref: '#/components/schemas/PublisherByIdModel'
                required:
                  - type
                  - Publisher
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
    patch:
      tags:
        - Publisher
      summary: Update Publisher Information
      description: Update Publisher Social accounts with verified and linked flags
      operationId: patchPublisherPublisherIdAccounts
      parameters:
        - name: key
          in: query
          description: |
            Specifies which identifier is used in the request.
            Set to `id` if you are using the internal `id` field as identifier.
            If you are using `PublisherId` as identifier(default behavior), this parameter should be omitted.
          required: false
          schema:
            type: string
            enum:
              - Id
              - PublisherId
              - NetworkPublisherId
            pattern: '^[a-zA-Z0-9]+$'
            examples:
              - Id
          examples:
            default:
              value: Id
        - name: publisherId
          in: path
          description: Unique Publisher identifier
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9]+$'
            examples:
              - '99999'
          examples:
            default:
              value: '99999'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                PublisherName:
                  type: string
                  description: Publisher Name
                  maxLength: 255
                  examples:
                    - test
                PublisherId:
                  type: integer
                  description: Publisher Id
                  examples:
                    - 3293835
                NetworkPublisherId:
                  type:
                    - string
                    - 'null'
                  description: Network Publisher Id
                  default: null
                  examples:
                    - '3293836'
                Glasses:
                  type: integer
                  enum:
                    - 0
                    - 1
                    - null
                  description: Glasses
                  examples:
                    - 0
                AccountManagerName:
                  type:
                    - string
                    - 'null'
                  description: Account Manager Name
                  default: null
                  examples:
                    - John Smith
                OutsideManagerName:
                  type:
                    - string
                    - 'null'
                  description: Outside Manager Name
                  default: null
                  examples:
                    - John Smith
                ManagementCompany:
                  type:
                    - string
                    - 'null'
                  description: Management Company
                  default: null
                  examples:
                    - John Smith
                RecruiterName:
                  type:
                    - string
                    - 'null'
                  description: Recruiter Name
                  default: null
                  examples:
                    - John Smith
                Subnetworks:
                  type:
                    - string
                    - 'null'
                  description: Subnetworks
                  default: null
                  examples:
                    - 'Subnetwork1, Subnetwork2, Subnetwork3'
                Status:
                  type: string
                  enum:
                    - Open
                    - Active
                    - New Applicant
                    - Pending
                    - Not Accepted
                    - Applied to Network
                    - Candidate
                    - Incomplete
                    - null
                  description: Status
                  examples:
                    - Open
                StatusCategory:
                  type: string
                  enum:
                    - In Network
                    - In Process
                    - Other
                    - null
                  description: Status Category
                  examples:
                    - In Network
                CustomValue1:
                  type:
                    - string
                    - 'null'
                  description: Custom value number 1
                  maxLength: 1000
                  default: null
                  examples:
                    - test
                CustomValue2:
                  type:
                    - string
