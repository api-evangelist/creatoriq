  '/crm/v1/api/publisher/{publisherId}/scheduledPosts':
    get:
      tags:
        - Publisher
      summary: Get Publisher ScheduledPosts info
      description: Get Publisher ScheduledPosts
      operationId: getPublisherIdScheduledPosts
      parameters:
        - name: key
          in: query
          description: |
            Specifies which identifier is used in the request.
            Set to `id` if you are using the internal `id` field as identifier.
            If you are using `PublisherId` as identifier(default behavior), this parameter should be omitted.
          required: false
          schema:
            type: string
            enum:
              - Id
              - PublisherId
            pattern: '^[a-zA-Z0-9]+$'
            examples:
              - Id
          examples:
            default:
              value: Id
        - name: page
          in: query
          description: page number
          schema:
            type: string
            examples:
              - '2'
          examples:
            default:
              value: '2'
        - name: size
          in: query
          description: number of elements on page
          schema:
            type: string
            examples:
              - '20'
          examples:
            default:
              value: '20'
        - name: publisherId
          in: path
          description: Unique Publisher identifier
          required: true
          schema:
            type: string
            examples:
              - '20'
          examples:
            default:
              value: '20'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignScheduledPostsSuccessResponseModel'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
  '/crm/v1/api/publishers/{publisherIds}/accounts':
    get:
      tags:
        - Publisher
      summary: GET social accounts for multiple publishers.
      description: |
        Fetch the social accounts information for bulk publishers. Max count of publishers 10.
        > **Warning**: This API endpoint is deprecated and will be removed at 2026-04-16. You could use the [new version of endpoint](https://apidocs.creatoriq.com/docs/ciq-api-documentation/5d20075e89450-get-social-accounts-for-multiple-publishers) instead of this one.
      operationId: getMultiplePublishersAccounts
      parameters:
        - name: publisherIds
          in: path
          description: Comma separated unique Publisher IDs.
          required: true
          schema:
            type: string
            pattern: '^[0-9]+(,[0-9]+)*$'
            examples:
              - '99990,99991'
          examples:
            default:
              value: '99990,99991'
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiplePublishersAccounts'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      deprecated: true
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
  '/crm/v1/api/publisher/{publisherId}/accounts':
    get:
      tags:
        - Publisher
      summary: GET publisher's social accounts
      description: Fetch the social account information for publisher
      operationId: getPublisherAccounts
      parameters:
        - name: key
          in: query
          description: |
            Specifies which identifier is used in the request.
            Set to `id` if you are using the internal `id` field as identifier.
            If you are using `PublisherId` as identifier(default behavior), this parameter should be omitted.
          required: true
          schema:
            type: string
            enum:
              - Id
              - PublisherId
            examples:
              - Id
          examples:
            default:
              value: Id
        - name: publisherId
          in: path
          description: Unique Publisher's ID
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
            examples:
              - '9999'
          examples:
            default:
              value: '9999'
      responses:
        '200':
          description: Response 200
          content:
            application/json:
              schema:
                type: object
                description: Publisher Accounts Collection
                properties:
                  type:
                    type: string
                    description: Type of Search
                    examples:
                      - AccountCollection
                  href:
                    type: string
                    description: href
                    examples:
                      - 'https://apis.creatoriq.com/crm/v1/api/publisher/99999999999'
                  AccountCollection:
                    type: array
                    items:
                      $ref: '#/components/schemas/SocialAccountModel'
                required:
                  - type
                  - href
                  - AccountCollection
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
    post:
      tags:
        - Publisher
      summary: Add Publisher Social accounts information
      description: Add Publisher Social accounts information
      operationId: addPublisherSocialAccount
      parameters:
        - name: source
          in: query
          description: Type of input data ('link' or 'user')
          required: true
          schema:
            type: string
            enum:
              - link
              - user
            examples:
              - link
          examples:
            default:
              value: link
        - name: accountSource
          in: query
          description: Account source
          required: false
          schema:
            type: string
            examples:
              - crm
          examples:
            default:
              value: crm
        - name: key
          in: query
          description: |
            Specifies which identifier is used in the request.
            Set to `id` if you are using the internal `id` field as identifier.
            If you are using `PublisherId` as identifier(default behavior), this parameter should be omitted.
          required: false
          schema:
            type: string
            enum:
              - Id
              - PublisherId
            examples:
              - Id
          examples:
            default:
              value: Id
        - name: publisherId
          in: path
          description: Unique Publisher identifier
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
            examples:
              - '99999'
          examples:
            default:
              value: '99999'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                link:
                  type: string
                  description: Link to social account
                  format: URI
                  examples:
                    - 'https://www.youtube.com/@username'
                user:
                  type: string
                  description: |
                    Username in social network. Available chars are:
                    - Capital and small letters (latin)
                    - Point `.`
                    - Minus `-`
                    - Underscore `_`
                    - "AT" char `@`
                  pattern: '^[\w.\-_@]+$'
                  examples:
                    - user_name
                network:
                  type: string
                  enum:
                    - Youtube
                    - Facebook
                    - Instagram
                    - Google
                    - Vine
                    - Tumblr
                  description: 'Social network (Facebook, Instagram, Google, Vine, Tumblr etc.)'
                  examples:
                    - Youtube
                CreatedBy:
                  type: string
                  description: Name of person who added Social Account
                  examples:
                    - John Smith
                CreatorRole:
                  type: string
                  description: Role of person who added Social Account
                  examples:
                    - Admin
                VerifiedBy:
                  type: string
                  description: Name of person who verified Social Account
                  examples:
                    - John Smith
                VerifiedAt:
                  type: string
                  description: 'Date and Time when Social Account was verified (e.g. 2015-06-04 10:00:01.000)'
                  format: date-time
                  examples:
                    - '2021-01-30T08:30:00Z'
                LinkedBy:
                  type: string
                  description: Name of person who linked Social Account
                  examples:
