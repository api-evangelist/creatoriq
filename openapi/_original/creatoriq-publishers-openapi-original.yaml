  /crm/v1/api/communication/sendBulk:
    post:
      tags:
        - Publisher
      summary: Send emails to publishers in bulk.
      description: Send emails to publishers in bulk.
      operationId: sendMessageToPublishersBulk
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CCToCurrent:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: |
                    CCToCurrent is a flag that indicates whether a copy of the message should be sent to 
                    the sender (author) of the message. Setting the "CCToCurrent" flag = 1 means that a copy will be 
                    sent to the author of the letter.
                  format: int32
                  examples:
                    - 1
                Date:
                  type: string
                  description: Message sent date
                  examples:
                    - '2020-02-29'
                FromMcn:
                  type: integer
                  description: This is the ID of the current user logged into the CRM or the ID of the user on whose behalf the API key is being used.
                  format: int32
                  examples:
                    - 100013349
                MessageContent:
                  type: string
                  description: Message content. Can include a Cpp Link placeholder - Client (Creator) Payment Processing link. See example
                  examples:
                    - 'Test CppLink: {{CppLink}}'
                Subject:
                  type: string
                  description: Subject
                  examples:
                    - Subject
                messageId:
                  type: string
                  description: Message Id
                  examples:
                    - '9999'
                ToCC:
                  type: string
                  description: |
                    ToCC - is analog of the carbon copy of standard email protocol. Cc stands for carbon copy
                    which means that whose address appears after the Cc header would receive a copy of the message. 
                    Also, the Cc header would also appear inside the header of the received message.
                  examples:
                    - 'email1@gmail.com, email2@gmail.com'
                type:
                  type: object
                  description: Message type. Can be "Email" (email send) or/and "Message" (internal only in CRM send)
                  properties:
                    Email:
                      type: integer
                      enum:
                        - 0
                        - 1
                      description: |
                        If the "Email" flag = 1, this means that the message type is set as "Email" and will 
                        be sent as an email. If the "Email" flag = 0, the message will not be sent as an email.
                        The "Email" and "Message" flags can be used together. For example, "Email = 0", 
                        "Message = 1" - means that only an internal message within the CRM will be sent.
                      format: int32
                      examples:
                        - 1
                    Message:
                      type: integer
                      enum:
                        - 0
                        - 1
                      description: |
                        If the "Message" flag = 1, this means that the type of message being sent is set as 
                        "Message" and will be sent as an internal message in the CRM with saving to the dbo.Messages 
                        database table. The Message flag = 0 means that the internal message within the CRM will not 
                        be sent. The "Email" and "Message" types can be used together.
                        For example, "Email = 1", "Message = 1" - means that both an email and an internal 
                        message in the CRM will be sent.
                      format: int32
                      examples:
                        - 1
                ToPublishers:
                  type: array
                  items:
                    type: integer
                    description: 'Publishers Ids. Can contain no more than 1,000 different IDs.'
                    format: int32
                    examples:
                      - 999999
                AttachmentsLinks:
                  type: array
                  description: |
                    This is an array of objects for sending preloaded attachments to the letter. 
                    To use them, you need to have a response from the AWS Bitbucket responsible for uploading files.
                  examples:
                    - - FileName: Screenshot 2023-05-03 at 12.51.19.png
                        AttachmentLink: 'https://twc-attachments.s3.us-west-1.amazonaws.com/599407372_Screenshot%202023-05-03%20at%2012.51.19.png'
                        AttachmentThumbnail: 'https://twc-attachments.s3.us-west-1.amazonaws.com/thumbnails/thumb_57fcda4899162340996cbf6ab4ed25ca_8403080.png'
                        ContentSize: 38721
                  items:
                    type: object
                    description: |
                      This is object for sending preloaded attachments to the letter.
                      To use them, you need to have a response from the AWS Bitbucket responsible for uploading files.
                    properties:
                      FileName:
                        type: string
                        description: Attachment File Name
                        examples:
                          - Screenshot 2023-05-03 at 12.51.19.png
                      AttachmentLink:
                        type: string
                        description: Attachment Link
                        format: URI
                        examples:
                          - 'https://twc-attachments.s3.us-west-1.amazonaws.com/599407372_Screenshot%202023-05-03%20at%2012.51.19.png'
                      AttachmentThumbnail:
                        type: string
                        description: Attachment Thumbnail url
                        format: URI
                        examples:
                          - 'https://twc-attachments.s3.us-west-1.amazonaws.com/thumbnails/thumb_57fcda4899162340996cbf6ab4ed25ca_8403080.png'
                      ContentSize:
                        type: integer
                        description: Size of attachment in bytes
                        format: int32
                        examples:
                          - 38721
                    examples:
                      - FileName: Screenshot 2023-05-03 at 12.51.19.png
                        AttachmentLink: 'https://twc-attachments.s3.us-west-1.amazonaws.com/599407372_Screenshot%202023-05-03%20at%2012.51.19.png'
                        AttachmentThumbnail: 'https://twc-attachments.s3.us-west-1.amazonaws.com/thumbnails/thumb_57fcda4899162340996cbf6ab4ed25ca_8403080.png'
                        ContentSize: 38721
                ShowBodyInChat:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: Show body in chat flag - Is show a body of a message in a chat with a creator?
                  format: int32
                  examples:
                    - 1
                Event:
                  type: string
                  description: 'This is an internal CRM field for processing the logic of different types of messages and events. To send emails and/or internal messages for the CRM, it is recommended to set "Event": "sendMessage"'
                  examples:
                    - Event
              required:
                - MessageContent
                - Subject
                - type
                - ToPublishers
      responses:
        '204':
          description: Successful
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
