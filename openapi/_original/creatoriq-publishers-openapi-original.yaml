            - 'null'
          description: Name of the person who recruited or is recruiting Publisher
          default: null
          examples:
            - John Smith
        SubNetworkName:
          type: string
          description: 'Use to farther categorize Publishers and Channels, usually based on YouTube network.  I.e. Owned and Operated'
          examples:
            - Owned and Operated
        InterfaceLocale:
          type:
            - string
            - 'null'
          default: null
        Address:
