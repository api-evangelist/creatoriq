  '/crm/v1/api/data/publisher/{publisherId}/audience':
    patch:
      tags:
        - Publisher
      summary: Add/Update the audience data for a publisher.
      description: |
        Edit or add audience data to the publisher's social account. To be able to use this API, you need required fields that can be derived from [Get publisher's social accounts API](https://creatoriq.stoplight.io/docs/ciq-api-documentation/53138e18cb0a8-get-publisher-s-social-accounts).

          1. Fetch list of social accounts from [Get publisher's social accounts API](https://creatoriq.stoplight.io/docs/ciq-api-documentation/53138e18cb0a8-get-publisher-s-social-accounts) for the publisher.
          2. From the `AccountCollection` property, get the following for the social network you intend to add/edit audience data:
            - SocialId (use value of `ChannelId` for Youtube Account or `Id` field for any other Social Account)
            - Network
            - SocialNetworkId
            - NetworkUser   
          3. Fill in these required fields when calling this API.
      operationId: manualAudienceAddEdit
      parameters:
        - name: publisherId
          in: path
          description: Unique Publisher identifier
          required: true
          schema:
            type: integer
            examples:
              - 12344
          examples:
            default:
              value: 12344
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                SocialId:
                  type: integer
                  description: |
                    SocialAccountId for account. Can be fetched by [GET publisher's social accounts](https://creatoriq.stoplight.io/docs/ciq-api-documentation/53138e18cb0a8-get-publisher-s-social-accounts):
                    `AccountCollection->Social->Id` (`AccountCollection->Channel->ChannelId` for YouTube account) property
                  examples:
                    - 25485805
                Network:
                  type: string
                  enum:
                    - youtube
                    - twitter
                    - facebook
                    - instagram
                    - google
                    - vine
                    - weibo
                    - line
                    - tiktok
                    - twitch
                    - tumblr
                    - pinterest
                    - snapchat
                    - linkedin
                    - reddit
                    - web
                    - blog
                  description: Type of network of social account
                  maxLength: 50
                  examples:
                    - instagram
                NetworkUser:
                  type: string
                  description: Name of account in social network
                  maxLength: 50
                  examples:
                    - marcelotwelve
                SocialNetworkId:
                  type: string
                  description: Id of account in Social Network
                  examples:
                    - '176702683'
                MalePercentage:
                  type: number
                  examples:
                    - 23.3
                FemalePercentage:
                  type: number
                  examples:
                    - 45.3
                AgeGroup1:
                  type: string
                  examples:
                    - 13-17
                AgeGroup2:
                  type: string
                  examples:
                    - 18-24
                AgeGroup3:
                  type: string
                  examples:
                    - 25-34
                AgeGroup4:
                  type: string
                  examples:
                    - 35-44
                AgeGroup5:
