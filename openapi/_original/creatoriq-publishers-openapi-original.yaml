tags:
  - name: Publisher
    description: Publisher public API
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: x-api-key
      in: header
  responses:
    '400':
      description: 'Bad request, invalid PublisherID format'
    '401':
      description: The request could not be completed due to invalid API credentials
    '403':
      description: Access was denied due to the API due to insufficient access permissions.
    '404':
      description: Publisher with supplied ID was not found
    POSTContactResponse400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/POSTContactResponse400Model'
    POSTContactResponse:
      description: Ok
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                const: Address
                examples:
                  - Address
              href:
                type: string
                examples:
                  - 'https://apis.creatoriq.com/crm/v1/api/data/contact/117938214'
              Address:
                $ref: '#/components/schemas/AddressModel'
            required:
              - type
              - href
              - Address
    ErrorResponse404PATCHContactData:
      description: Supplied ID was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse404PATCHContactDataModel'
    createPublisherResponse200:
      description: Ok
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                const: Publisher
                examples:
                  - Publisher
              href:
                type: string
                examples:
                  - 'https://apis.creatoriq.com/crm/v1/api/publisher/10011762349'
              Publisher:
                $ref: '#/components/schemas/PublisherModel'
            required:
              - type
              - href
              - Publisher
    400DeleteContactData:
      description: Oops! Something went wrong.
    updatePublisherSocialAccountResponse:
      description: Social account data update info
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updatePublisherSocialAccountResponseModel'
    publisherDiscoResponse:
      description: Successful add to network
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublisherDiscoModelResponse'
  schemas:
    PublisherByIdModel:
      type: object
      allOf:
        - $ref: '#/components/schemas/PublisherModel'
        - type: object
          properties:
            LDACompliant:
              type: integer
              enum:
                - 2
                - 1
                - 0
                - null
              description: |
                Legal Drinking Age (LDA) Compliant flag.

                Meanings:
                - `2`: Creator is highly likely to have an LDA-compliant audience on their Instagram account(s) (green)
                - `1`: Creator is likely to have an LDA-compliant audience on at least one of their Instagram accounts (orange)
                - `0`: Creator is unlikely to have an LDA-compliant audience on their Instagram account(s) (red)
                - `null`: Creator doesn't have Instagram accounts. It's also possible that error has occurred while getting an LDA value
              examples:
                - 1
          required:
            - LDACompliant
    PublisherModel:
      type: object
      properties:
        Id:
          type: integer
          description: 'Internal CreatorIQ identifier. This value is unique and immutable (cannot be changed). It is used by the system to uniquely identify the entity. This ID can be found in the UI (e.g., in the browser URL). To use this identifier in update requests, you must explicitly specify the query parameter `key=id`'
          examples:
            - 2386944
        NetworkPublisherId:
          type: string
          description: Same as `PublisherId`. This field contains the same value and is provided for compatibility. It represents an external identifier that can be updated and is used by default in update operations.
          examples:
            - '10001356198'
        PublisherId:
          type: string
          description: 'External identifier used for integrations and mapping with third-party systems. This value can be updated. By default, this identifier is used when updating an account (unless `key=id` is specified)'
          examples:
            - '10001356198'
        ChannelId:
          type:
            - string
            - 'null'
          description: YouTube unique channel Identifier.  i.e. UCkDbLiXbx6CIRZuyW9sZK1g
          examples:
            - UCkDbLiXbx6CIRZuyW9sZK1g
        ChannelName:
          type:
            - string
            - 'null'
          description: YouTube Channel Name.  If this field is left blank and YouTube ChannelId is specified SocialEdge will attempt to retrieve ChannelName via YouTube API
          examples:
            - My YouTube channel
        ChannelTitle:
          type:
            - string
            - 'null'
          description: Primary YouTube Channel title
          examples:
            - My YouTube Channel title
        ContentOwner:
          type:
            - string
            - 'null'
          description: Content owner
          examples:
            - John Smith
        Token:
          type:
            - string
            - 'null'
          description: YouTube access token for this channel
          examples:
            - 20c965fe7b0c3aec8a596a74b8f4deee
        PublisherName:
          type: string
          description: Publisher Name.  I.e. John Smith.  If this field is left blank and YouTube channel is specified SocialEdge will use YouTube Channel Name as default and will attempt to look this up via Google Plus API
          examples:
            - John Smith
        LastUpdated:
          type: string
          description: Date when publisher last updated
          examples:
            - '2022-03-01 08:12:26'
        Status:
          type:
            - string
            - 'null'
          description: Publisher status
          default: null
          examples:
            - Active
        StatusCategory:
          type:
            - string
            - 'null'
          description: Status category
          default: null
          examples:
            - In Network
        Language:
          type:
            - string
            - 'null'
          description: Publisher's primary language.  I.E. English.  If this field is left blank and YouTube channel is specified SocialEdge will attempt to look this up via YouTube API
          default: null
          examples:
            - English
        SecondaryLanguage:
          type:
            - string
            - 'null'
          description: Publisher's secondary language
          default: null
          examples:
            - English
        Size:
          type:
            - string
            - 'null'
          description: 'This field can be used to categorize Publishers.  I.e. ''Star'', ''Starlet'' or ''Large'', ''Small'''
          default: null
          examples:
            - Starlet
        LeadSource:
          type:
            - string
            - 'null'
          description: 'I.e. Web, Outreach, Referral'
          default: null
          examples:
            - Web
        EthnicBackground:
          type:
            - string
            - 'null'
          description: 'I.e. Asian, Caucasian, African American'
          default: null
          examples:
            - Asian
        Category:
          type:
            - string
            - 'null'
          description: 'Primary category. I.e. Music, Style, Fitness'
          default: null
          examples:
            - Style
        SubCategories:
          type:
            - string
            - 'null'
          description: Comma separated subcategories for publisher
          default: null
        Gender:
          type:
            - string
            - 'null'
          description: 'I.e. Male, Female, Transgender'
          default: null
          examples:
            - Female
        DateOfBirth:
          type:
            - string
            - 'null'
          description: Publisher's date of birth
          default: null
          examples:
            - '15/05/1996 16:30:20'
        Description:
          type:
            - string
            - 'null'
          description: If this field is left blank and YouTube channel is specified SocialEdge will attempt to look up YouTube channel description via YouTube API and use it as default value
          default: null
          examples:
            - My channel description
        PublisherStatus:
          type:
            - string
            - 'null'
          description: 'Used to indicate recruiting status.  I.e. ''Contract Signed'', ''Rejected''.  Refer to product documentation for list of options'
          default: null
          examples:
            - In Network
        PublisherStatusCategory:
          type:
            - string
            - 'null'
          description: 'Additional information about recruiting status.   I.e. ''Waiting for Activation'', ''Too Small''.  This field is used together with PublisherStatus.  Refer to product documentation for list of options'
          default: null
          examples:
            - Waiting for Activation
        LogoURL:
          type:
            - string
            - 'null'
          description: Link to image to use for Publisher.  If this field is left blank and YouTube ChannelId is specified SocialEdge will attempt to retrieve thumbnail from YouTube API and use it as a default value
          default: null
          examples:
            - 'https://someside.com/someimg.png'
        DateRecruitingStarted:
          type:
            - string
            - 'null'
          description: The date when creator was added to CRM
          default: null
          examples:
            - '15/05/1996 16:30:20'
        LegalGuardian:
          type: string
          description: Publisher's legal guardian if Publisher is a minor
          examples:
            - John Smith
        LegalGuardianEmail:
          type: string
          description: Publisher's legal guardian email
          examples:
            - johnsmith@gmail.com
        HasAdSense:
          type: boolean
          examples:
            - false
        AdSenseIssue:
          type: string
          description: Indicates if Publisher has AdSence issues for Primary YouTube Channel
          examples:
            - ''
        RecruiterName:
          type:
