  schemas:
    generalSchema:
      type: object
      properties:
        TaskId:
          type: string
          description: Unique id of report
          example: 79985e5d-8871-4f38-be44-605d58f90bd9
        TaskStatus:
          type: string
          enum:
            - CREATED
            - PROCESSING
            - DONE
          description: |
            Status of request. 
            * CREATED: represents of new created report
            * PROCESSING: your report is progress 
            * DONE: your report is ready. Result present in  **Result => Headers => Location URL**
        CreatedAtTS:
          type: integer
          description: Timestamp when task is created in seconds
          example: 1674135497
        UpdatedAtTS:
          type: integer
          description: Timestamp when task is updated in seconds
          example: 1674135497
        ExpiresAtTS:
          type: integer
          description: Timestamp when task is expired in seconds.
          example: 1674136497
        CreatedAt:
          type: string
          description: Date which task created in human readable format
          example: '2023-01-19T13:38:17+0000'
        UpdatedAt:
          type: string
          description: Date which task updated in human readable format
          example: '2023-01-19T13:38:17+0000'
        ExpiredAt:
          type: string
          description: Date which task updated in human readable format
          example: '2023-01-19T13:38:17+0000'
        Metadata:
          type: object
          properties:
            PartnerId:
              type: integer
              example: 21
            Gri:
              type: object
              description: Used for logging
            ValidUntil:
              type: string
              example: '2023-01-19T14:08:16+0000'
            ValidUntilTS:
              type: integer
              example: 1674137296
        Result:
          type: object
          oneOf:
            - type: object
              description: If your object ready you fetch you receive 302 result
              properties:
                Status:
                  type: integer
                  description: Http status of response
                  example: 302
                Body:
                  type: string
                  description: Empty string represents body of response.
                  example: ''
                Headers:
                  type: object
                  properties:
                    Cache-Control:
                      type: string
                      example: max-age=7200
                    Date:
                      type: string
                      example: 'Thu, 19 Jan 2023 13:39:22 +0000'
                    Location:
                      type: string
                      description: Most important field! Result location of data
                      readOnly: true
                      example: 'https://ciq-api-async-results-data.s3.us-west-1.amazonaws.com/creatoriq-live/report.json'
                  required:
                    - Location
              required:
                - Status
                - Headers
            - type: object
              description: If your report not ready empty object
      required:
        - TaskId
        - TaskStatus
        - CreatedAtTS
        - UpdatedAtTS
        - ExpiresAtTS
        - CreatedAt
        - UpdatedAt
        - ExpiredAt
        - Result
    twitterWeeklyCampaignUpdatesSchema:
      type: object
      allOf:
        - $ref: '#/components/schemas/commonResponse'
        - type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  CampaignId:
                    type: integer
                    description: Unique CampaignId
                    format: int32
                    example: 697096
                  id:
                    type: integer
                    description: Unique id of row
                    format: int32
                    example: -80378
                  WeekNum:
                    type: string
                    nullable: true
                    description: Date start of the week when calculated metrics delta
                    format: date
                    example: '2019-04-04'
                  PublisherName:
                    type: string
                    description: Publisher Name
                    maxLength: 255
                    example: Chris Whitcroft
                  SocialHandle:
                    type: string
                    nullable: true
                    description: Social Handle
                    default: null
                    example: '@1puglife'
                  CampaignName:
                    type: string
                    nullable: true
                    description: Campaign name
                    maxLength: 255
                    default: null
                    example: Campaign name
                  BrandName:
                    type: string
                    nullable: true
                    description: Campaign Brand Name
                    maxLength: 200
                    default: null
                    example: Brand name
                  PostLink:
                    type: string
                    nullable: true
                    description: Post Link
                    format: URI
                    maxLength: 1000
                    default: null
                    example: 'https://twitter.com/_CristianRivero/status/1531342833617084416'
                  PostType:
                    type: string
                    nullable: true
                    enum:
                      - permalink
                      - story
                      - image
                      - reel
                      - Photo
                      - video
                      - tweet
                      - TiktokPost
                      - stream
                      - other
                      - article
                      - status
                      - blog
                      - short
                      - link
                      - carousel
                      - clip
                      - post
                      - text
                      - Album
                      - null
                    description: Post Type
                    maxLength: 20
                    example: image
                  DateSubmitted:
                    type: string
                    nullable: true
                    description: Date Submitted
                    format: date-time
                    default: null
                    example: '2023-02-07 03:39:44'
                  PostDate:
                    type: string
                    nullable: true
                    description: Post Date
                    format: date
                    example: '2023-02-07'
                  Post:
                    type: string
                    nullable: true
                    description: Post full text
                    default: null
                    example: Post text
                  PostStatus:
                    type: string
                    nullable: true
                    enum:
                      - Actual
                      - Approved
                      - Missing
                      - Rejected
                      - null
                    description: Post Status
                    example: Rejected
                  Likes:
                    type: integer
                    nullable: true
                    description: Likes
                    default: null
                    example: 17
                  Comments:
                    type: integer
                    nullable: true
                    description: Comments
                    default: null
                    example: 3
                  Impressions:
                    type: integer
                    nullable: true
                    description: Impressions
                    default: null
                    example: 233
                  Retweets:
                    type: integer
                    nullable: true
                    description: Retweets
                    default: null
                    example: 98
                  SMV:
                    type: number
                    nullable: true
                    description: Social Media Value. It is used to measure the value of the influencer campaign against the cost of driving the same results via paid social media advertising
                    default: null
                    example: 345
                  Reach:
                    type: integer
                    nullable: true
                    description: Reach
                    default: null
                    example: 233
                  Views:
                    type: integer
                    nullable: true
                    description: Views
                    default: null
                    example: 253
                  Clicks:
                    type: integer
                    nullable: true
                    description: Clicks
                    default: null
                    example: 235
                  NetworkEngagements:
                    type: number
                    nullable: true
                    description: Network Engagements
                    default: null
                    example: 235
                  Replies:
                    type: integer
                    nullable: true
                    description: Replies
                    default: null
                    example: 116
                  LinkingStatus:
                    type: string
                    nullable: true
                    enum:
                      - Broken
                      - Linked
                      - null
                    description: Linking Status
                    maxLength: 6
                    example: Linked
                  LastUpdated:
                    type: string
                    nullable: true
                    description: Last Updated
                    format: date-time
                    default: null
                    example: '2021-11-08 07:58:33'
                  PublisherId:
                    type: integer
                    description: Unique publisher id
                    format: int32
                    example: 3293835
                  LogoURL:
                    type: string
                    nullable: true
                    description: Publisher Logo URL
                    format: URI
                    maxLength: 1024
                    default: null
                    example: 'https://social-pictures-storage.s3.amazonaws.com/fe4da4409bd9de12f17ccfe3da07ce67_1605793259.jpg'
                  ThumbLogoURL:
                    type: string
                    nullable: true
                    description: Publisher Logo URL with reduced size
                    format: URI
                    maxLength: 512
                    default: null
                    example: 'https://social-pictures-storage.s3.amazonaws.com/fe4da4409bd9de12f17ccfe3da07ce67_1605793259.jpg'
                  FlagshipSocialNetwork:
                    type: string
                    nullable: true
                    enum:
                      - youtube
                      - twitter
                      - facebook
                      - instagram
                      - google
                      - vine
                      - weibo
                      - line
                      - tiktok
                      - twitch
                      - tumblr
                      - pinterest
                      - snapchat
                      - linkedin
                      - reddit
                      - web
                      - blog
                      - null
                    description: Main social network for publisher
                    maxLength: 50
                    example: instagram
                  FlagshipProperty:
                    type: string
                    nullable: true
                    description: Main social account handle of publisher
                    maxLength: 1024
                    default: null
                    example: greatdad
                  Followers:
                    type: integer
                    nullable: true
                    description: Followers
                    default: null
                    example: 78247
          required:
            - results
    commonResponse:
      type: object
      properties:
        count:
          type: integer
          description: Count of all reports
          example: 300
        dataGenerationTime:
          type: string
          description: Date when report generated
          example: '2023-01-20T13:43:47+00:00'
        cached:
          type: boolean
          description: Is view cached or not
        time:
          type: number
          description: Time taken to generate report
          format: float32
          example: 0.571
