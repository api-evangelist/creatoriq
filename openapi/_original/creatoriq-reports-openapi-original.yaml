openapi: 3.0.1
info:
  version: 1.0.0
  title: CreatorIQ Reporting APIs
  description: |
    This is reporting async API
  termsOfService: 'https://www.creatoriq.com/legal/terms-of-use'
  contact:
    name: CreatorIQ
    url: 'https://www.creatoriq.com'
    email: support@creatoriq.com
  license:
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
    name: Apache 2.0
servers:
  - url: 'https://apis.creatoriq.com'
    description: Live
paths:
  /crm/v1/api/view?view=Reports/Campaigns/CampaignPosts:
    get:
      tags:
        - Reporting
      summary: Get campaign post statistics
      description: |
        Your report will be stored at Result => Headers => Location url when status task is DONE
      operationId: getCampaignPosts
      parameters:
        - $ref: '#/components/parameters/dir'
        - $ref: '#/components/parameters/section'
        - $ref: '#/components/parameters/take'
        - $ref: '#/components/parameters/skip'
        - name: 'requestData[sort][0][field]'
          in: query
          description: |
            Field for sorting can be sorted by 
            * CampaignName
            * Comments
            * Likes
            * SocialNetwork
            * Reach
            * PublisherName
            * FlagshipPropertyTitle : represents primary account
          schema:
            type: string
            enum:
              - CampaignName
              - Comments
              - Likes
              - SocialNetwork
              - Reach
              - PublisherName
              - FlagshipPropertyTitle
            example: CampaignName
          examples:
            default:
              value: CampaignName
      responses:
        '200':
          $ref: '#/components/responses/asyncResponse'
        Result:
          $ref: '#/components/responses/campaignPostReport'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
  /crm/v1/api/view?view=Reports/Campaigns/CampaignsSummary:
    get:
      tags:
        - Reporting
      summary: Get campaign summary report
      description: 'Get statistics for all campaigns like number of creators, number of posts by campaign'
      operationId: getSummaryReport
      parameters:
        - $ref: '#/components/parameters/dir'
        - $ref: '#/components/parameters/section'
        - $ref: '#/components/parameters/take'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/skip'
        - name: 'requestData[sort][0][field]'
          in: query
          description: |
            Can sort by 
            *  CampaignId
            *  CampaignName
            *  YTPosts: count of Youtube posts
          schema:
            type: string
            enum:
              - CampaignId
              - CampaignName
              - YTPosts
            example: CampaignId
          examples:
            default:
              value: CampaignId
      responses:
        '200':
          $ref: '#/components/responses/asyncResponse'
        Result:
          $ref: '#/components/responses/campaignSummaryReport'
      security:
        - apiKey: []
      servers:
        - url: 'https://apis.creatoriq.com'
          description: Live
