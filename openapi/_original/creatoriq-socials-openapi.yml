          format: date-time
          example: '2015-06-26 22:46:50'
        dateUpdated:
          type: string
          nullable: true
          description: Unique youtube account id
          format: date-time
          example: '2015-06-26 22:46:50'
        dateLastVideoUploaded:
          type: string
          nullable: true
          description: Unique youtube account id
          format: date-time
          example: '2015-06-26 22:46:50'
        uploadsPlaylistId:
          type: string
          description: Unique youtube account id
          example: UUeNhHgTE36tTQkJsjPaPwnA
        timeline:
          type: object
