    InstagramPostModel:
      type: object
      title: InstagramPostModel
      properties:
        type:
          type: string
          enum:
            - InstagramPost
          description: Type of Model
          example: InstagramPost
        href:
          type: string
          description: CreatorIQ API URL to get creator's instagram post
          format: URI
          example: 'https://apis.creatoriq.com/crm/v1/api/social/instagram/post/Cm-qszQrIla'
        InstagramPost:
          type: object
          properties:
            id:
              type: string
              description: |
                Unique post ID.<br>
                Post ID (except story): `Cm-qszQrIlf`<br>
                Story ID: `3063056958558704839_4561785114`
              example: Cm-qszQrIlf
            url:
              type: string
              description: |
                Url to post on social network.<br>
                Post link (except story): `https://www.instagram.com/p/Cm-qszQrIlf`<br>
                Story link: `https://instagram.com/stories/thenatnote/3063056958558704839`
              format: URI
              example: 'https://www.instagram.com/p/Cm-qszQrIlf'
            thumbnail:
              type: string
              description: Url to post thumbnail
              format: URI
              example: 'https://social-pictures-storage.s3.us-west-1.amazonaws.com/instagram/thumbnail/Cm-qszQrIla.jpg'
            savedThumbnail:
              type: string
              description: Url to saved post thumbnail
              format: URI
              example: 'https://static-resources.creatoriq.com/social-pictures/instagram/thumbnail/Cm-qszQrIlf.jpg'
            video:
              type: string
              description: Url to video
              format: URI
              example: ''
            type:
              type: string
              enum:
                - video
                - image
                - carousel
                - reel
                - story
              description: Post type
              example: carousel
            userName:
              type: string
              description: Username on social network
              example: therock
            accountId:
              type: integer
              description: Unique account id
              example: 18428653
            mediaId:
              type: string
              description: Unique media id
              example: '18198237445238010_18428658'
            createdAt:
              type: string
              description: Post created date
              format: date-time
              readOnly: true
              example: '2023-01-03T20:04:29-08:00'
            caption:
              type: string
              description: Post text
              example: |-

                ♥️ night! ♥️
            location:
              type: object
              nullable: true
              description: Location information
              properties:
                latitude:
                  type: number
                  description: Latitude
                  example: 47.5180288
                longitude:
                  type: number
                  description: Longitude
                  example: 12.9037159
              required:
                - latitude
                - longitude
            comments:
              type: integer
              nullable: true
              description: Post comments count
              example: 1113
            likes:
              type: integer
              nullable: true
              description: Post likes count
              example: 9134
            reach:
              type: integer
              nullable: true
              description: Number of users who have seen the post
              example: 340245835
            engagement:
              type: integer
              description: Engagement count
              example: 3175554
            impressions:
              type: integer
              nullable: true
              description: Impressions count
              example: 81659000
              x-deprecated: true
            views_next:
              type: integer
              nullable: true
              description: |
                Views count
                > **Warning**: The **impressions** field will be deprecated soon. Use this field instead of it.
              example: 81659000
            earnings:
              type: number
              nullable: true
              description: Earnings count
              example: 3880714.15
            processingInfo:
              type: array
              items:
                type: string
              example: []
            isElastic:
              type: boolean
              description: Flag if data came from Elastic
              example: true
              x-deprecated: true
            network:
              type: string
              enum:
                - instagram
              description: Network name
              example: instagram
            insights:
              type: object
              nullable: true
              description: Insights data (can be nullable)
              oneOf:
                - $ref: '#/components/schemas/Instagram_post_reel_insights'
                - $ref: '#/components/schemas/Instagram_post_carousel_insights'
                - $ref: '#/components/schemas/Instagram_post_image_insights'
                - $ref: '#/components/schemas/Instagram_post_story_insights'
            source:
              type: string
              description: Data source where it came from
              example: elastic
            cachedAt:
              type: string
              nullable: true
              description: Date when the raw Post data has been cached
              format: date-time
              example: '2022-09-12T22:01:24-08:00'
              x-deprecated: true
            linkedInfo:
              $ref: '#/components/schemas/linkedInfo'
            lastUpdated:
              type: string
              nullable: true
              format: date-time
              example: '2023-03-27T08:11:44+00:00'
            videoViews:
              type: integer
              nullable: true
              description: |
                Video view count
                > **Warning**: This field is deprecated and value always be null. The value of views now displays in **impressions** field.
              example: null
              x-deprecated: true
            mentions:
              type: array
              nullable: true
              description: Mentions list
              items:
                type: string
                description: Instagram user name
                example: therock
              example: []
            hashtags:
              type: array
              nullable: true
              description: Hashtags list
              items:
                type: string
                description: Hashtag
                example: '#tag'
              example: []
            tapstag:
              type: array
              nullable: true
              description: Post taptag list
              items:
                type: object
                description: Post taptag data
                properties:
                  id:
                    type: string
                    description: Instagram ID
                    example: '17841400005463628'
                  username:
                    type: string
                    description: Instagram user name
                    example: therock
                required:
                  - id
                  - username
              example: []
            pnkHash:
              type: string
              description: post natural key identifier
              example: d93eab6d9ac3a37c12a242f347934e816285230d
          required:
            - id
            - url
            - thumbnail
            - savedThumbnail
            - video
            - type
            - userName
            - accountId
            - mediaId
            - createdAt
            - caption
            - location
            - comments
            - likes
            - reach
            - engagement
            - impressions
            - earnings
            - processingInfo
            - isElastic
            - network
            - insights
            - source
            - cachedAt
            - linkedInfo
            - lastUpdated
            - mentions
      required:
        - type
        - href
        - InstagramPost
