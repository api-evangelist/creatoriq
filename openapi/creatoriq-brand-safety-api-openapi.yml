openapi: 3.2.0
info:
  version: 1.0.0
  title: CreatorIQ SafeIQ Brand Safety API
  description: 'SafeIQ brand safety timeline API for retrieving a historical, paginated collection of posts where brand safety issues were detected. Works together with the SafeIQ brand safety webhook: the webhook delivers notifications, and this REST API provides full details and reconciliation.'
  termsOfService: https://www.creatoriq.com/legal/terms-of-use
  contact:
    name: CreatorIQ
    url: https://www.creatoriq.com/
    email: support@creatoriq.com
  license:
    url: https://www.apache.org/licenses/LICENSE-2.0.html
    name: Apache 2.0
servers:
- url: https://apis.creatoriq.com
  description: Live
security:
- apiKey: []
tags:
- name: Brand Safety
  description: SafeIQ brand safety timeline API
paths:
  /brand-safety/v1/posts:
    get:
      tags:
      - Brand Safety
      summary: List brand safety posts
      description: Returns a paginated collection of posts where brand safety issues were detected. Supports filtering by creator, detection date, publish date, platform, and severity. Access is implicitly scoped to the authenticated partner and division.
      operationId: listBrandSafetyPosts
      parameters:
      - name: creator_id
        in: query
        description: Filters posts by creator.
        required: false
        schema:
          type: string
          examples:
          - '20985049'
        examples:
          default:
            value: '20985049'
      - name: detected_after
        in: query
        description: Returns posts where brand safety issues were detected after this timestamp. Recommended for incremental syncs.
        required: false
        schema:
          type: string
          format: date-time
          examples:
          - '2026-05-01T00:00:00Z'
        examples:
          default:
            value: '2026-05-01T00:00:00Z'
      - name: detected_before
        in: query
        description: Returns posts where brand safety issues were detected before this timestamp.
        required: false
        schema:
          type: string
          format: date-time
          examples:
          - '2026-06-01T00:00:00Z'
        examples:
          default:
            value: '2026-06-01T00:00:00Z'
      - name: published_after
        in: query
        description: Returns posts published on the social network after this timestamp.
        required: false
        schema:
          type: string
          format: date-time
          examples:
          - '2026-05-01T00:00:00Z'
        examples:
          default:
            value: '2026-05-01T00:00:00Z'
      - name: published_before
        in: query
        description: Returns posts published on the social network before this timestamp.
        required: false
        schema:
          type: string
          format: date-time
          examples:
          - '2026-06-01T00:00:00Z'
        examples:
          default:
            value: '2026-06-01T00:00:00Z'
      - name: platform
        in: query
        description: Filters by social platform, for example youtube, tiktok, instagram.
        required: false
        schema:
          type: string
          examples:
          - tiktok
        examples:
          default:
            value: tiktok
      - name: severity
        in: query
        description: Filters by severity. Accepts a comma-separated subset of high, medium, low.
        required: false
        schema:
          type: string
          examples:
          - high,medium
        examples:
          default:
            value: high,medium
      - name: limit
        in: query
        description: Number of posts to return.
        required: false
        schema:
          type: integer
          default: 100
          examples:
          - 100
        examples:
          default:
            value: 100
      - name: cursor
        in: query
        description: Pagination cursor returned from the previous response.
        required: false
        schema:
          type: string
          examples:
          - eyJuYW1lIjoiSm9yZGFuIExlZSIsImlkIjoiMTAwNSJ9
        examples:
          default:
            value: eyJuYW1lIjoiSm9yZGFuIExlZSIsImlkIjoiMTAwNSJ9
      responses:
        '200':
          $ref: '#/components/responses/BrandSafetyPostsCollection'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/Creator404'
        '500':
          $ref: '#/components/responses/500'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
  /brand-safety/v1/posts/{post_id}:
    get:
      tags:
      - Brand Safety
      summary: Get brand safety post details
      description: Returns full details for a single post, including the complete array of brand safety issues. Webhook consumers use the api_details_link from the webhook payload to call this endpoint.
      operationId: getBrandSafetyPost
      parameters:
      - name: post_id
        in: path
        description: Public post identifier.
        required: true
        schema:
          type: string
          examples:
          - post_12345
        examples:
          default:
            value: post_12345
      responses:
        '200':
          $ref: '#/components/responses/BrandSafetyPostDetail'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
  /check:
    post:
      tags:
      - Brand Safety
      summary: BrandSafety
      description: 'Efficiently screen creators using your tailored brand safety keyword sets, identify potential issues by reviewing flagged posts, and ensure each creator aligns with your brand''s safety standards


        **Timeout: ~27 seconds**'
      operationId: BrandSafety
      parameters:
      - name: Authorization
        in: header
        description: 'Format: `Authorization: ciq_token <your_token>`

          '
        required: true
        schema:
          type: string
          examples:
          - ciq_token 123
        examples:
          default:
            value: ciq_token 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./brandsafety_schemas.yaml#/components/schemas/BrandSafetyBodyParams
            examples:
              Simple:
                value:
                  CRM:
                  - 13731801
                  - 14336736
                  - 15678198
                  Discovery:
                  - 13731801
                  - 14336736
                  - 15678198
              Short:
                value:
                  CRM:
                  - 13731801
                  - 14336736
                  - 15678198
                  Discovery:
                  - 13731801
                  - 14336736
                  - 15678198
                  Short: true
              FullWithAggregation:
                value:
                  CRM:
                  - 13731801
                  - 14336736
                  - 15678198
                  Discovery:
                  - 13731801
                  - 14336736
                  - 15678198
                  AdditionalFields:
                    Aggregation:
                      Brands: true
                      Games: true
                      Types: true
                      Sponsored: true
                      Networks: true
      responses:
        '200':
          description: A valid response
          content:
            application/json:
              schema:
                $ref: ./brandsafety_schemas.yaml#/components/schemas/BrandSafetyBodyParams
              examples:
