      responses:
        '200':
          $ref: '#/components/responses/asyncResponse'
        Result:
          $ref: '#/components/responses/creatorPromote'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
  /crm/v1/api/view?view=Reports/CreatorsReport:
    get:
      tags:
      - General
      summary: Get Creators Report
