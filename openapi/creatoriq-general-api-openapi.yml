      - $ref: '#/components/parameters/take'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/section'
      - name: requestData[sort][0][field]
        in: query
        description: Field for sorting
        schema:
          type: string
          enum:
          - PublisherName
          - PublisherId
          - SocialNetwork
          example: PublisherId
        examples:
          default:
            value: PublisherId
      responses:
        '200':
          $ref: '#/components/responses/asyncResponse'
        Result:
          $ref: '#/components/responses/publishersList'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
components:
  responses:
    creatorPromote:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/creatorPromote'
    dailyCampaignPosts:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/dailyCampaignPosts'
    importTemplateReport:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/importTemplateReport'
    asyncResponse:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/generalSchema'
    creatorsReport:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/creatorsReport'
    channelReport:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/channelReport'
    creatorConnect:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/creatorConnect'
    publishersList:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/publishersList'
    creatorContactInfoReport:
      description: Final result stored by **Result -> Headers -> Location** field. Available when status is **DONE**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/creatorContactInfoReport'
  schemas:
    publishersList:
      type: object
      allOf:
      - $ref: '#/components/schemas/commonResponse'
      - type: object
        properties:
          results:
            type: array
            minItems: 1
            items:
              type: object
              properties:
                PublisherId:
                  type: integer
                  example: 572571
                LogoURL:
                  type: string
                  description: Publisher Logo URL
                  format: URI
                  example: https://social-pictures-storage.s3.amazonaws.com/medium_f60bb277b588e9dc652f2abe8197864457257.jpeg
                ThumbLogoURL:
                  type: string
                  description: Publisher Logo URL with reduced size
                  format: URI
                  example: https://social-pictures-storage.s3.amazonaws.com/thumb_f60bb277b588e9dc652f2abe8197864457257.jpeg
                PublisherName:
                  type: string
                  example: John Doe
                Email:
                  type:
                  - string
                  - 'null'
                  format: email
                  example: john.doe@example.com
                FlagshipProperty:
                  type:
                  - string
                  - 'null'
                  description: Main social account handle of publisher
                  example: '@johndoe22222'
                FlagshipPropertyTitle:
                  type:
                  - string
                  - 'null'
                  description: Title of main social account in publisher
                  example: '@johndoe22222'
                FlagshipSocialNetwork:
                  type:
                  - string
                  - 'null'
                  enum:
                  - youtube
                  - twitter
                  - facebook
                  - instagram
                  - google
                  - vine
                  - weibo
                  - line
                  - tiktok
                  - twitch
                  - tumblr
                  - pinterest
                  - snapchat
                  - linkedin
                  - reddit
                  - web
                  - blog
                  - null
                  description: Main social network for publisher
                  example: youtube
                SocialAccountsList:
                  type:
                  - string
                  - 'null'
                  description: XML representation of publisher's Social Accounts
                  example: <row xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><Network>instagram</Network><SocialNetworkId>103892434426157</SocialNetworkId><NetworkUser>john.doe.ig</NetworkUser><AccountWeight>10</AccountWeight><WebReach>0</WebReach><Title>john.doe.ig</Title><Followers>14</Followers><LinkedBy>John Doe</LinkedBy><LinkedAt>2022-07-18T13:28:34</LinkedAt><isVerifiedBySocialNetwork>0</isVerifiedBySocialNetwork><Linked>0</Linked><Unlinked>0</Unlinked><LinkBroken>1</LinkBroken><Business>0</Business><TokenInvalidDate>2022-10-20T08:44:24.147</TokenInvalidDate><DateSocialStatsUpdated>2023-03-01T16:35:33</DateSocialStatsUpdated><WhitelistingExpirationDate xsi:nil="true"/></row>
                YT_Subscribers:
                  type: integer
                  example: 7572
                YT_AverageMonthlyViews:
                  type: number
                  example: 4365757257.72725
                Status:
                  type: string
                  example: Open
                StatusCategory:
                  type: string
                  example: In process
              required:
              - PublisherId
        required:
        - results
    creatorsReport:
      type: object
      allOf:
      - $ref: '#/components/schemas/commonResponse'
      - type: object
        properties:
