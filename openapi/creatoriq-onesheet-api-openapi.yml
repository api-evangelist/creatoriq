      description: Live
  /crm/v1/api/onesheet/{oneSheetId}/publish:
    post:
      tags:
      - Onesheet
      summary: Publish one-sheet
      description: Publish one-sheet
      operationId: PublishOneSheet
      parameters:
      - name: oneSheetId
        in: path
        description: OneSheet Id
        required: true
        schema:
          type: integer
          example: 333333
        examples:
          default:
            value: 333333
      responses:
        '204':
          $ref: '#/components/responses/PublishOneSheet'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
    servers:
    - url: https://apis.creatoriq.com
      description: Live
  /crm/v1/api/view?view=OneSheetBuilder/OneSheetBuilder:
    get:
      tags:
      - Onesheet
      summary: Get OneSheet Builder
      description: Fetch OneSheet Publishers
      operationId: getOneSheetBuilder
      parameters:
      - $ref: '#/components/parameters/section'
      - $ref: '#/components/parameters/take'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/dir'
      - name: requestData[sort][0][field]
        in: query
        description: "Field for sorting can be sorted by \n* SortOrder\n* PublisherName\n* TotalSubscribers\n* CreatedAt\n* UpdatedAt\n* FlagshipSocialNetwork : represents primary social network\n* FlagshipPropertyTitle : represents primary account\n"
        schema:
          type: string
          enum:
          - SortOrder
          - PublisherName
          - TotalSubscribers
          - CreatedAt
          - UpdatedAt
          - FlagshipSocialNetwork
          - FlagshipPropertyTitle
          example: SortOrder
        examples:
          default:
            value: SortOrder
      - name: requestData[sort][0][name]
        in: query
        description: 'Sorting field name

          * SortOrder

          * PublisherName

          * TotalSubscribers

          * CreatedAt

          * UpdatedAt

          * FlagshipSocialNetwork

          * FlagshipPropertyTitle

          '
        schema:
          type: string
          enum:
          - SortOrder
          - PublisherName
          - TotalSubscribers
          - CreatedAt
          - UpdatedAt
          - FlagshipSocialNetwork
          - FlagshipPropertyTitle
          example: SortOrder
        examples:
          default:
            value: SortOrder
      - name: requestData[params][SalesSheetId]
        in: query
        description: OneSheet ID
        schema:
          type: integer
          example: 757214
        examples:
          default:
            value: 757214
      responses:
        '200':
          $ref: '#/components/responses/asyncResponse'
        Result:
          $ref: '#/components/responses/oneSheetBuilder'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
    servers:
    - url: https://apis.creatoriq.com
      description: Live
components:
  schemas:
    CreateOneSheetBody:
      type: object
      properties:
        Name:
          type: string
          description: Name of OneSheet
          example: Test OneSheet
        TotalReachCalculation:
          type: string
          enum:
          - Selected
          - Full
        templateId:
          type:
          - integer
          - 'null'
          example: 2351
      required:
      - Name
    AddPublisherToOneSheetBody:
      type: object
      properties:
        PublisherIds:
          type: array
          items:
            type: integer
            example: 13201168
      required:
      - PublisherIds
    AddPublisherCommentToOneSheetBody:
      type: object
      properties:
        Email:
          type: string
          description: Publisher comment email
          format: email
          example: test@gmail.com
        CreatedBy:
          type: string
          description: Publisher comment creator
          example: Test Name
        Comment:
          type:
          - string
          - 'null'
          description: Publisher comment
          example: Test comment
        SocialEdgeId:
          type:
          - string
          - 'null'
          description: Publisher comment SocialEdgeId
          example: Test Comment SocialEdgeId
      required:
      - Email
      - CreatedBy
    OneSheetCreatedModel:
      type: object
      properties:
        type:
          type: string
          enum:
          - OneSheet
          description: Type of Search
          example: OneSheet
        href:
          type: string
          description: CreatorIQ API URL to get onesheet
          format: URI
          example: https://apis.creatoriq.com/crm/v1/api/onesheet/99999
        OneSheet:
          type: object
          properties:
            Id:
              type: integer
              example: 4326
            Name:
              type: string
              example: Test OneSheet
            VanityURL:
              type: string
              example: Test_OneSheet_63dcba77c85
            CreatedById:
              type: integer
              example: 10004117
            PartnerId:
              type: integer
              example: 21
            UpdatedAt:
              type: string
              example: '2023-02-03 07:44:01'
            CreatedBy:
              type: string
              example: Test app
            SalesSheetImageURL:
              type:
              - string
              - 'null'
              format: URI
              example: https://s3.us-west-1.amazonaws.com/resources.creatoriq.com/whitelabelling/21_b744bd6c3cd/dark_logo_8dq7maua0m.png
            VanityHost:
              type: string
              format: URI
              example: https://onesheets.creatoriq.com
            Expired:
              type: boolean
              example: false
            TotalReachCalculation:
              type: string
              enum:
              - Selected
              - Full
              example: Full
            TopMetrics:
              type: array
              items:
                type: object
                properties:
                  network:
                    type: string
                    example: web
                  field:
                    type: string
                    example: MonthlyUniqueVisitors
                  label:
                    type: string
                    example: Last 30 Days Uniques
            PublishersCount:
              type: integer
              example: 0
            CommentsCount:
              type: integer
              example: 6
      required:
      - type
      - href
      - OneSheet
    OneSheetUpdatedModel:
      type: object
      properties:
        Id:
          type: integer
          example: 64826
        templateId:
          type:
          - integer
          - 'null'
          example: 2351
      required:
      - Id
      - templateId
    OneSheetInCollection:
      type: object
      properties:
        type:
          type: string
          enum:
          - OneSheet
          description: Type of Search
          example: OneSheet
        href:
          type: string
          description: CreatorIQ API URL to get onesheet-related information
          format: URI
          example: https://apis.creatoriq.com/crm/v1/api/onesheet/99999
        OneSheet:
          type: object
          properties:
            Id:
              type: integer
              example: 395809
            PartnerId:
              type: integer
              example: 21
            Name:
              type: string
              example: LS - Test One-Sheet for 2305 - Stage
            VanityURL:
              type:
              - string
              - 'null'
              example: LS___Test_One_Sheet_for_2305___Stage_63d93cac18e7a
            Data:
              type:
              - string
              - 'null'
              description: JSON string containing OneSheet's data
              example: '{"Sections":{"PersonalData":1}}'
            CreatedBy:
              type: string
              example: New Manager User
            CreatedAt:
              type: string
              example: '2023-01-31 16:07:08'
            UpdatedBy:
              type:
              - string
              - 'null'
              example: New Manager User
            UpdatedAt:
              type: string
              example: '2023-01-31 16:46:50'
            Expired:
              type: boolean
              example: false
            ExpireAt:
              type:
              - string
              - 'null'
              example: '2023-02-28 23:59:00'
            DeleteAt:
              type:
              - string
              - 'null'
              example: null
            ExternalUser:
              type:
              - string
              - 'null'
              example: null
            IsPublished:
              type: integer
              example: 1
            SendNotifications:
              type: integer
              example: 0
            AllowComments:
              type: integer
              enum:
              - 0
              - 1
              example: 1
            NotifyEmails:
              type:
              - string
              - 'null'
              example: test1@test.com,test2@example.com
            SalesSheetImageURL:
              type: string
              format: URI
              example: https://s3.us-west-1.amazonaws.com/resources.creatoriq.com/whitelabelling/fyhte56ste/dark_logo_8dq7maua0m.png
            TopMetrics:
              type: array
              items:
                type: object
                properties:
                  network:
                    type: string
                    example: instagram
                  field:
                    type: string
                    example: Followers
                  label:
                    type: string
                    example: Followers
            CustomOrder:
              type:
              - string
              - 'null'
              example: null
            VanityHost:
              type:
              - string
              - 'null'
              example: http://onesheets.creatoriq.com
            DivisionId:
              type:
              - integer
              - 'null'
              example: null
            CreatedById:
              type: integer
              example: 1000120
            PublishersCount:
              type: integer
              example: 20
            Advertiser:
              type:
              - object
              - 'null'
              properties:
                AdvertiserId:
                  type: integer
                  example: 9999
                AdvertiserName:
                  type: string
                  example: Adv. Name
                Description:
                  type:
                  - string
                  - 'null'
                  example: Some description
              required:
              - AdvertiserId
            Campaign:
              type:
              - object
              - 'null'
              properties:
                CampaignId:
                  type: integer
                  example: 426161
                CampaignName:
                  type: string
                  example: Some Campaign name
            templateId:
              type: integer
              example: 7661
            TotalReachCalculation:
              type: string
              enum:
              - Selected
              - Full
              example: Full
            Sections:
              type: object
              properties:
                PersonalData:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                PersonalDataAge:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                PersonalDataCountry:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                PersonalDataGender:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                PersonalDataLanguage:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                Audience:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                AudienceAge:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                AudienceGender:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                AudienceCountry:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                AudienceState:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                AudienceCity:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                AudienceEthnicity:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 0
                AudienceIncomeRange:
                  type: integer
                  enum:
                  - 0
                  - 1
                  example: 1
                AudienceInterests:
                  type: integer
