          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
    post:
      tags:
      - Onesheet
      summary: Add Creator to Onesheet
      description: Adds Creator to Onesheet
      operationId: addCreatorToOnesheet
      parameters:
      - name: oneSheetId
        in: path
        description: OneSheet Id
        required: true
        schema:
          type: integer
          example: 333333
        examples:
          default:
            value: 333333
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddPublisherToOneSheetBody'
      responses:
        '201':
          description: Creator successfully added
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
    servers:
    - url: https://apis.creatoriq.com
      description: Live
  /crm/v1/api/onesheet/{oneSheetId}/publisher/{publisherId}:
    get:
      tags:
      - Onesheet
      summary: Get a certain Onesheet's Creator
      description: Gets a certain Onesheet's Creators
      operationId: getOnesheetSingleCreator
      parameters:
      - name: fields
        in: query
        description: \ Data fields to get info for. Default set (when parameter is not set or empty) is "summary,comments,isPostMigrationProcess,demographics,locations,audienceTotal,infoForAdvertisers"
        schema:
          type: string
          example: infoForAdvertisers,isPostMigrationProcess
        examples:
          default:
            value: infoForAdvertisers,isPostMigrationProcess
      - name: oneSheetId
        in: path
        description: OneSheet Id
        required: true
        schema:
          type: integer
          example: 333333
        examples:
          default:
            value: 333333
      - name: publisherId
        in: path
        description: Creator Id
        required: true
        schema:
          type: integer
          example: 642626
        examples:
          default:
            value: 642626
      responses:
        '200':
          $ref: '#/components/responses/OneSheetCreator'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
    delete:
      tags:
      - Onesheet
      summary: Remove creator from one-sheet
      description: Remove creator from one-sheet
      operationId: RemoveCreator
      parameters:
      - name: oneSheetId
        in: path
        description: OneSheet Id
        required: true
        schema:
          type: integer
          example: 333333
        examples:
          default:
            value: 333333
      - name: publisherId
        in: path
        description: Creator Id
        required: true
        schema:
          type: integer
          example: 642626
        examples:
          default:
            value: 642626
      responses:
        '204':
          description: Deleted Successful
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
    patch:
      tags:
      - Onesheet
      summary: Update one-sheet creator
      description: Update one-sheet creator
      operationId: UpdateOneSheetCreator
      parameters:
      - name: oneSheetId
        in: path
        description: OneSheet Id
        required: true
        schema:
          type: integer
          example: 333333
        examples:
          default:
            value: 333333
      - name: publisherId
        in: path
        description: Creator Id
        required: true
        schema:
          type: integer
          example: 642626
        examples:
          default:
            value: 642626
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOneSheetCreatorBody'
      responses:
        '204':
          description: Successful
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
      security:
      - apiKey: []
      servers:
      - url: https://apis.creatoriq.com
        description: Live
    servers:
    - url: https://apis.creatoriq.com
      description: Live
  /crm/v1/api/onesheet/{oneSheetId}/publisher/{publisherId}/approve:
    patch:
      tags:
