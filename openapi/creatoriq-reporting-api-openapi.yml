  schemas:
    growthRate:
      type: object
      allOf:
      - $ref: '#/components/schemas/commonResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                PublisherId:
                  type: integer
                  example: 23332
                PublisherName:
                  type: string
                  example: John Doe
                LogoURL:
                  type: string
                  description: Publisher Logo URL
                  format: URI
                  example: https://logoUrl.jpg
                ThumbLogoURL:
                  type: string
                  description: Publisher Logo URL with reduced size
                  format: URI
                  example: https://thumbLogoUrl.jpg
                CIQID:
                  type: integer
                  description: Alias for PublisherId
                  format: int32
                  example: 23332
                PartnerId:
                  type: integer
                  format: int32
                  minimum: 1
                  example: 21
                Network:
                  type: string
                  enum:
                  - youtube
                  - twitter
                  - facebook
                  - instagram
                  - google
                  - vine
                  - weibo
                  - line
                  - tiktok
                  - twitch
                  - tumblr
                  - pinterest
                  - snapchat
                  - linkedin
                  - reddit
                  - web
                  description: Social account which represents growth rate
                  example: instagram
                NetworkUser:
                  type: string
                  description: Social handle
                  example: therock
                SocialId:
                  type: integer
                  description: Unique social Id
                  example: 1682572
                ActualFollowersNumber:
                  type: integer
                  description: Followers count for publisher
                  format: int32
                  example: 220000
                StatDateYear:
                  type: integer
                  format: int32
                  example: 2022
                StatDateMonth:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 12
                  example: 12
                Followers:
                  type: integer
                  format: int32
                  example: 2323
                PrevMonthFollowers:
                  type: integer
                  format: int32
                  example: 100
                GrowthRatePercentage:
                  type: number
                  format: float
                  example: 25.06
                GrowthRate:
                  type: number
                  format: float
                  example: 0.0024
                RowNum:
                  type: integer
                  description: For internal usage
                  example: 0
                IgnoreFlag:
                  type: integer
                  enum:
                  - 0
                  - 1
                  description: '* If 1 then do not report publisher as fraud

                    * If 0 then calculate fraud flags

                    '
                  default: 0
                  example: 0
                IgnoredBy:
                  type:
                  - string
                  - 'null'
                  description: User which setup IgnoreFlag
                  default: null
                  example: Admin
                IgnoredAt:
                  type:
                  - string
                  - 'null'
                  description: When IgnoreFlag flag is setup
                  default: null
                  example: '2019-01-23 18:16:33.000'
                IgnoreNote:
                  type:
                  - string
                  - 'null'
                  default: null
                  example: Note
              required:
              - PublisherId
              - PublisherName
        required:
        - results
    twitterCampaignPostsSchema:
      type: object
      allOf:
      - $ref: '#/components/schemas/commonResponse'
      - type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                CampaignId:
                  type: integer
                  description: Unique CampaignId
                  format: int32
                  example: 697096
                id:
                  type: integer
                  description: Unique id of row
                  format: int32
                  example: -80378
                WeekNum:
                  type:
                  - string
                  - 'null'
                  description: Date start of the week when calculated metrics delta
                  format: date
                  example: '2019-04-04'
                PublisherName:
                  type: string
                  description: Publisher Name
                  maxLength: 255
                  example: Chris Whitcroft
                SocialHandle:
                  type:
                  - string
                  - 'null'
                  description: Social Handle
                  default: null
                  example: '@1puglife'
                CampaignName:
                  type:
                  - string
                  - 'null'
                  description: Campaign name
                  maxLength: 255
                  default: null
                  example: Campaign name
                BrandName:
                  type:
                  - string
                  - 'null'
                  description: Campaign Brand Name
                  maxLength: 200
                  default: null
                  example: Brand name
                PostLink:
                  type:
                  - string
                  - 'null'
                  description: Post Link
                  format: URI
                  maxLength: 1000
                  default: null
                  example: https://twitter.com/_blackpinkita/status/1631408244479361025
                PostType:
                  type:
                  - string
                  - 'null'
                  enum:
                  - permalink
                  - story
                  - image
                  - reel
                  - Photo
                  - video
                  - tweet
                  - TiktokPost
                  - stream
                  - other
                  - article
                  - status
                  - blog
                  - short
                  - link
                  - carousel
                  - clip
                  - post
                  - text
                  - Album
                  - null
                  description: Post Type
                  maxLength: 20
                  example: video
                DateSubmitted:
                  type:
                  - string
                  - 'null'
                  description: Date Submitted
                  format: date-time
                  default: null
                  example: '2023-02-07 03:39:44'
                PostDate:
                  type:
                  - string
                  - 'null'
                  description: Post Date
                  format: date
                  example: '2023-02-07'
                Post:
                  type:
                  - string
                  - 'null'
                  description: Post full text
                  default: null
                  example: Post text
                PostStatus:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Actual
                  - Approved
                  - Missing
                  - Rejected
                  - null
                  description: Post Status
                  example: Rejected
                Likes:
                  type:
                  - integer
                  - 'null'
                  description: Likes
                  default: null
                  example: 17
                Comments:
                  type:
                  - integer
                  - 'null'
                  description: Comments
                  default: null
                  example: 3
                Impressions:
                  type:
                  - integer
                  - 'null'
                  description: Impressions
                  default: null
                  example: 233
                Retweets:
                  type:
                  - integer
                  - 'null'
                  description: Retweets
                  default: null
                  example: 98
                SMV:
                  type:
                  - number
                  - 'null'
                  description: Social Media Value. It is used to measure the value of the influencer campaign against the cost of driving the same results via paid social media advertising
                  default: null
                  example: 345
                Reach:
                  type:
                  - integer
                  - 'null'
                  description: Reach
                  default: null
                  example: 233
                Views:
                  type:
                  - integer
                  - 'null'
                  description: Views
                  default: null
                  example: 253
                Clicks:
                  type:
                  - integer
                  - 'null'
                  description: Clicks
                  default: null
                  example: 235
                NetworkEngagements:
                  type:
                  - number
                  - 'null'
                  description: Network Engagements
                  default: null
                  example: 235
                Replies:
                  type:
                  - integer
                  - 'null'
                  description: Replies
                  default: null
                  example: 116
                LinkingStatus:
                  type:
                  - string
                  - 'null'
                  enum:
                  - Broken
                  - Linked
                  - null
                  description: Linking Status
                  maxLength: 6
                  example: Linked
                FollowersAtTimeOfPost:
                  type:
                  - integer
                  - 'null'
                  description: Followers At Time Of Post
                  default: null
                  example: 223676
                LastUpdated:
                  type:
                  - string
                  - 'null'
                  description: Last Updated
                  format: date-time
                  default: null
                  example: '2021-11-08 07:58:33'
                PublisherId:
                  type: integer
                  description: Unique publisher id
                  format: int32
                  example: 3293835
                LogoURL:
                  type:
                  - string
                  - 'null'
                  description: Publisher Logo URL
