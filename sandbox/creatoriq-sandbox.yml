summary: >-
  CreatorIQ has two distinct sandboxes and they behave very differently. The one it advertises is a
  provisioned sandbox instance that only a salesperson can give you. The one that actually works
  without asking anybody is the Prism mock server behind every spec in its Stoplight portal — publicly
  reachable, returning schema-accurate example payloads, and never mentioned in the docs.
sandboxes:
- name: CreatorIQ sandbox instance
  type: provisioned-tenant
  self_serve: false
  url: null
  access: >-
    Requested from a CreatorIQ sales representative or account manager, who provisions a sandbox
    environment and issues an API key for it. Documented in the General FAQ under "Do you have a
    sandbox environment I can use to explore CIQ APIs?".
  limitations_quote: >-
    It is possible to only see some of the comprehensive metrics and data points in the sandbox. Still,
    our API documentation reference should provide the expected attributes in the response.
  test_credentials: none published
  note: >-
    There is no test-vs-live key prefix, no mode flag, and no documented way to tell from a key whether
    it points at sandbox or production. The separation is a separate tenant, not a separate credential
    class.
- name: Stoplight Prism mock servers
  type: hosted-mock
  self_serve: true
  probed: true
  auth: >-
    Prism enforces the declared securityScheme's presence only — any non-empty x-api-key value returns
    200. An anonymous request returns 401.
